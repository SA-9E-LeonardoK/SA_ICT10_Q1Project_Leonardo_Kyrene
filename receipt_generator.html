<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project - 1st Quarter | Chiikawa Patisserie</title>
 
    <!-- Bootstrap 5 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
 
    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>
 
    <style>
    @font-face {
        font-family: 'ITC Bauhaus';
        src: url('ITCBauhaus.otf') format('opentype');
        font-weight: normal;
        font-style: normal;
    }
        :root {
            --sky: #d6eaee;      /* page background */
            --pink: #ffc2c2;     /* navbar + footer */
            --cream: #fdf8e8;    /* menu card */
            --brown: #4a3222;    /* text, borders, button */
        }
 
        html, body {
            height: 100%;
        }
 
        body {
            background: var(--sky);
            min-height: 100vh;
            font-family: 'Poppins', system-ui, sans-serif;
            color: var(--brown);
            padding: 10px;
            display: flex;
            flex-direction: column;
        }
 
        .navbar {
            background-color: var(--pink) !important;
            border: 2px solid var(--brown);
            border-radius: 0.5rem;
        }
        .navbar-brand {
            font-family: 'ITC Bauhaus', sans-serif;
            color: var(--brown) !important;
            font-size: 1.1rem;
        }
        .navbar-brand img {
            height: 1.4rem;
            margin-right: 0.3rem;
        }
        .nav-link {
            color: var(--brown) !important;
            margin-left: 1.5rem;
        }
        .page-title {
            font-family: 'ITC Bauhaus', sans-serif;
            font-size: 3.5rem;
            color: var(--brown);
            margin-bottom: 1.5rem;
        }
        .hero-img {
            max-width: 100%;
        }
 
        .app-card {
            background: var(--cream);
            border: 2px solid var(--brown);
            border-radius: 0.75rem;
            box-shadow: none;
        }
        .app-card .card-header,
        .app-card .card-footer {
            display: none;
        }
        .app-card h5 {
            font-family: 'ITC Bauhaus', sans-serif;
            font-size: 2rem;
            text-align: center;
            color: var(--brown);
        }
        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 0;
            border: none;
            margin-bottom: 0.4rem;
        }
        .menu-item:hover {
            background: transparent;
        }
        .menu-item label {
            font-weight: 500;
            color: var(--brown);
            margin-left: 0.8rem;
            cursor: pointer;
        }
        .menu-item .price {
            display: none;
        }

        .form-check-input {
            width: 2rem;
            height: 2rem;
            margin-top: 0;
            background-color: transparent;
            border: 2px solid var(--brown);
            border-radius: 0.5rem;
        }
        .form-check-input:checked {
            background-color: var(--brown);
            border-color: var(--brown);
        }
        .form-check-input:focus {
            border-color: var(--brown);
            box-shadow: 0 0 0 0.2rem rgba(74, 50, 34, 0.25);
        }
        .btn-order {
            background: var(--brown);
            border: none;
            font-weight: 500;
            letter-spacing: 0;
            border-radius: 0.5rem;
        }
        .btn-order:hover {
            background: var(--brown);
            opacity: 0.9;
            color: #fff;
        }
 
        .app-card hr {
            display: none;
        }
        #show {
            min-height: 0;
            margin-top: 1rem;
        }
        #show, #show * {
            color: var(--brown) !important;
        }
        .result-box {
            background: #fff;
            border-left: 5px solid var(--brown);
            border-radius: 0.5rem;
            padding: 1rem 1.25rem;
        }
        .receipt-total {
            font-family: 'Courier New', monospace;
            font-weight: 700;
            font-size: 1.3rem;
            color: var(--brown);
        }
 
        footer {
            background-color: var(--pink) !important;
            color: var(--brown) !important;
            border: 2px solid var(--brown);
            border-radius: 0.5rem;
        }
 
        py-terminal {
            display: none;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                    <alt="">Chiikawa Pattiserie
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">
                            SKU Generator
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="receipt_generator.html">
                            Receipt Generator
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container py-5 flex-grow-1">
        <div class="row justify-content-center align-items-center">
 
            <!-- title with chiikawa ♡ˎˊ˗-->
            <div class="col-12 col-lg-6 mb-4 mb-lg-0">
                <h1 class="page-title">Receipt Generator</h1>
                <img src="https://i.pinimg.com/736x/0b/59/65/0b596512d14d6c27092b3c5d9e5aac9a.jpg" alt="Chiikawa characters baking" class="hero-img">
            </div>
 
            <!-- so the menus on hte right -->
            <div class="col-12 col-lg-5">
 
                <div class="card app-card">
                    <div class="card-header text-center">
                        <i class="fa-solid fa-mug-hot fa-2x mb-2"></i>
                    </div>
 
                    <div class="card-body p-4">
                        <h5 class="mb-3">
                            Menu
                        </h5>
 
                        <form id="order-form">
                            <div class="menu-item">
                                <div>
                                    <input class="form-check-input" type="checkbox" id="item1" value="99">
                                    <label id="item1-label" for="item1">⋆˚꩜｡ Chiikawa’s Croissant - ₱99</label>
                                </div>
                                <span class="price">₱99</span>
                            </div>
 
                            <div class="menu-item">
                                <div>
                                    <input class="form-check-input" type="checkbox" id="item2" value="129">
                                    <label id="item2-label" for="item2">⋆.𐙚 ̊Momonga’s Macaron - ₱129</label>
                                </div>
                                <span class="price">₱129</span>
                            </div>
 
                            <div class="menu-item">
                                <div>
                                    <input class="form-check-input" type="checkbox" id="item3" value="189">
                                    <label id="item3-label" for="item3">.⋆❀° Rakko’s Religieuse - ₱189</label>
                                </div>
                                <span class="price">₱189</span>
                            </div>
 
                            <div class="menu-item">
                                <div>
                                    <input class="form-check-input" type="checkbox" id="item4" value="159">
                                    <label id="item4-label" for="item4">.✦ ݁˖ Shisa's Souffle - ₱159</label>
                                </div>
                                <span class="price">₱159</span>
                            </div>
 
                            <div class="menu-item">
                                <div>
                                    <input class="form-check-input" type="checkbox" id="item5" value="129">
                                    <label id="item5-label" for="item5">₊˚⊹ᰔ Hachiware’s Hérisson - ₱129</label>
                                </div>
                                <span class="price">₱129</span>
                            </div>
 
                            <div class="d-grid mt-4">
                                <button type="button" py-click="create_order" class="btn btn-order btn-lg text-white">
                                    Complete Order 𖹭.ᐟ
                                </button>
                            </div>
                        </form>
 
                        <hr class="my-4">
 
                        <div id="show"></div>
                    </div>
 
                    <div class="card-footer text-center text-muted small py-3">
                        Select your items and click "Create Order"
                    </div>
                </div>
 
            </div>
        </div>
    </div>
 
    <footer class="text-center py-4">
        <div class="container">
            <p class="mb-1">
                Receipt Generator &mdash; ଇଓ . 1<sup>st</sup> Quarter Project
            </p>
        </div>
    </footer>
 
    <py-script src="main.py"></py-script>
 
    <!-- Bootstrap JS bundle (needed for navbar toggle on mobile) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
