<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1st Quarter Project | SKU Generator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>

    <style>
        @font-face {
            font-family: 'HeadingFont';
            src: url('ITCBauhaus.otf');
        }
        @font-face {
            font-family: 'BodyFont';
            src: url('Poppins.ttf');
        }

        body {
            background-color: #d7ecef;
            color: #4a3521;
            font-family: 'BodyFont', sans-serif;
        }
        h1, label, .navbar-brand {
            font-family: 'HeadingFont', sans-serif;
        }

        .topbar, .footer-bar {
            background-color: #ffc2c6;
            border: 3px solid #4a3521;
            border-radius: 15px;
            max-width: 1125px;
            margin: 20px auto;
        }
        .topbar a {
            color: #4a3521;
            text-decoration: none;
        }
        .footer-bar {
            padding: 15px;
            text-align: center;
        }

        .main-card {
            background-color: #fffaef;
            border: 3px solid #4a3521;
            border-radius: 15px;
            padding: 20px;
        }
        .form-control, .form-select {
            border: 2px solid #4a3521;
            border-radius: 10px;
        }
        .btn-generate {
            background-color: #4a3521;
            color: #fffaef;
            border-radius: 10px;
        }
        .btn-generate:hover {
            background-color: #4a3521;
            color: #fffaef;
            opacity: 0.85;
        }

        .result-box {
            background-color: #fffaef;
            border: 2px solid #4a3521;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }

        .sku-image {
            width: 100%;
            max-width: 420px;
        }
    </style>
</head>
<body>
    <nav class="topbar d-flex justify-content-between align-items-center px-4 py-3">
        <a class="navbar-brand fs-4" href="index.html">Chiikawa Pattiserie</a>
        <div>
            <a href="index.html" class="me-4">SKU Generator</a>
            <a href="receipt_generator.html">Receipt Generator</a>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row align-items-center">

            <div class="col-12 col-lg-5 mb-4">
                <div class="main-card">
                    <label for="category">Category</label>
                    <select id="category" class="form-select mb-3">
                        <option value="Hot Beverage">Hot Beverage</option>
                        <option value="Iced Beverage">Iced Beverage</option>
                        <option value="Dessert">Dessert</option>
                        <option value="Pastry">Pastry</option>
                    </select>

                    <label for="product_name">Product Name</label>
                    <input type="text" id="product_name" class="form-control mb-3" placeholder="e.g. Croissant">

                    <label for="quantity">Stock Quantity</label>
                    <input type="number" id="quantity" class="form-control mb-3" placeholder="e.g. 11" min="0">
                </div>

                <button py-click="SKU_generator" class="btn btn-generate w-100 mt-3">Generate SKU</button>

                <div id="sku_output" class="mt-3"></div>
            </div>

            <div class="col-12 col-lg-7 text-center">
                <h1 class="display-4 mb-4">SKU Generator</h1>
                <img src="ChiiBakery.jpg" alt="Chiikawa and Friends" class="sku-image">
                <p class="mt-3">Fill in the details and generate a unique SKU for your product!</p>
            </div>

        </div>
    </div>

    <footer class="footer-bar">
        SKU Generator   — ᨳଓ .  1st Quarter Project
    </footer>

    <py-script src="main.py"></py-script>
</body>
</html>
